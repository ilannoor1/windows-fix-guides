name: Validate Video Metadata

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/videos/**"
      - "scripts/validate_video_metadata.py"
      - ".github/workflows/validate-video-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate UniTech LK video metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Validate video metadata
        run: python scripts/validate_video_metadata.py
