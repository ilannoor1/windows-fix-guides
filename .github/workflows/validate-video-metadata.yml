name: Validate Video Metadata

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/videos/**"
      - "scripts/validate_video_metadata.py"
      - "scripts/generate_video_guide.py"
      - "scripts/render_video_preview.py"
      - "scripts/validate_video_preview.py"
      - ".github/workflows/validate-video-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate, plan and preview UniTech LK video guide
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Validate video metadata
        run: python scripts/validate_video_metadata.py

      - name: Dry-run video guide planner
        run: python scripts/generate_video_guide.py

      - name: Generate HTML preview
        run: python scripts/render_video_preview.py

      - name: Validate HTML preview safety
        run: python scripts/validate_video_preview.py

      - name: Upload HTML preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: unitechlk-video-preview-${{ github.run_id }}
          path: preview-output/
          if-no-files-found: error
          retention-days: 7
