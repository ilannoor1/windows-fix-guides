name: Update UniTech LK News

on:
  workflow_dispatch:

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unitechlk-news-and-pages
  cancel-in-progress: false

jobs:

  update-news:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run UniTech LK news updater
        run: |
          python scripts/update_news.py

      - name: Check for generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated news and sitemap
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "UniTech LK News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add news/ sitemap.xml

          git commit -m "Auto update UniTech LK technology news"

          git push origin main

      - name: No new changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No repository changes were generated."


  build-pages:
    needs: update-news
    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site


  deploy-pages:
    needs:
      - update-news
      - build-pages

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
